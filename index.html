.sp{flex:1}.me{font-size:12px;color:#cbd5e1;text-align:right}.me b{color:#fff}.me a{color:#93c5fd;cursor:pointer;margin-left:8px}

function stg(){if(!SGD)SGD=CFG.map(x=>({...x}));const L=SGD.length;
 return`<div class="bar"><b style="font-size:17px">Stages</b><span class="mu">Every lift follows this list, in this order.</span><span class="sp"></span><button class="b" data-a="sa">+ Add stage</button><button class="b p" data-a="ss">Save stages</button></div>
 <div class="cd" style="padding:0"><div class="tw"><table><thead><tr><th>#</th><th>Stage name</th><th>Payment stage</th><th>Tick for whole building by default</th><th></th></tr></thead><tbody>`+SGD.map((x,i)=>`<tr><td>${i+1}</td><td><input data-si="${i}" data-f="n" value="${E(x.n)}" style="width:100%;min-width:230px"></td><td style="text-align:center"><input type="checkbox" data-si="${i}" data-f="pay" ${x.pay?'checked':''}></td><td style="text-align:center"><input type="checkbox" data-si="${i}" data-f="bld" ${x.bld?'checked':''}></td><td style="text-align:right;white-space:nowrap">${x.k==='noc'?'<span class="mu">fixed · always last</span>':`<button class="b s" data-a="su" data-i="${i}" ${i===0?'disabled':''}>↑</button> <button class="b s" data-a="sd" data-i="${i}" ${i>=L-2?'disabled':''}>↓</button> <button class="b s d" data-a="sx" data-i="${i}">Remove</button>`}</td></tr>`).join('')+`</tbody></table></div></div>
 <p class="mu"><b>Payment stage</b> – counted in “Payments done” on the dashboard. <b>Tick for whole building by default</b> – when you tick this stage for one lift, “Apply to all lifts of this building” starts ticked. Renaming never loses ticks. Removing a stage hides its ticks (they stay in the database). “NOC Received” is fixed as the last stage because NOC counts and uploads depend on it. Press <b>Save stages</b> to apply your changes.</p>`}
function stgAct(k,i){const L=SGD.length;
 if(k==='su'&&i>0)[SGD[i-1],SGD[i]]=[SGD[i],SGD[i-1]];
 if(k==='sd'&&i<L-2)[SGD[i+1],SGD[i]]=[SGD[i],SGD[i+1]];
 if(k==='sx'){if(SGD[i].k==='noc')return;if(!confirm(`Remove the stage "${SGD[i].n}"? Ticks already made for it will be hidden (they stay in the database).`))return;SGD.splice(i,1)}
 if(k==='sa'){const n=prompt('Name of the new stage:');if(!n||!n.trim())return;const a=parseInt(prompt(`Insert it after which stage number? (1 to ${L-1})`,String(L-1)));SGD.splice(Math.min(Math.max(isNaN(a)?L-1:a,0),L-1),0,{k:'s'+Date.now().toString(36),n:n.trim()})}
 if(k==='ss')return saveStages();render()}
async function saveStages(){const l=SGD.map(x=>({k:x.k,n:(x.n||'').trim(),pay:!!x.pay,bld:!!x.bld}));if(l.some(x=>!x.n))return alert('Every stage needs a name.');
 try{await fdb.doc('config/stages').set({list:l});applyStages(l);SGD=null;toast('Stages saved ✓');render()}catch(e){alert(/permission/i.test(e.message||e.code)?'Could not save because the database rules need one more update. Please publish the latest rules (Firebase → Firestore → Rules) and try again.':'Could not save: '+e.message)}}
function usr(){const o=(u,r,t)=>`<option value="${r}"${u.role===r?' selected':''}>${t}</option>`;return`<div class="bar"><button class="b p" data-a="nu">+ Add user</button><span class="mu">Editor = marks steps done · Management = dashboard only · you = Super Admin</span></div><div class="cd" style="padding:0"><div class="tw"><table><thead><tr><th>Name</th><th>Email (login ID)</th><th>Role</th><th>Active</th><th></th></tr></thead><tbody>`+UL.map(u=>`<tr><td>${E(u.name)}</td><td>${E(u.email)}</td><td><select data-ur="${E(u.email)}">${o(u,'editor','Editor')}${o(u,'management','Management')}</select></td><td><input type="checkbox" data-ua="${E(u.email)}" ${u.active!==false?'checked':''}></td><td style="text-align:right"><button class="b s" data-a="rs" data-e="${E(u.email)}">Reset password</button> <button class="b s d" data-a="du" data-e="${E(u.email)}">Remove</button></td></tr>`).join('')+`</tbody></table></div></div>`}
function render(){if(!ROLE)return;const ok={dash:1,trk:canEdit(),prj:isS(),stg:isS(),usr:isS()};if(!ok[view])view='dash';
 document.querySelectorAll('nav button').forEach(b=>{b.hidden=!ok[b.dataset.v];b.classList.toggle('on',b.dataset.v===view)});
 const ps=[...new Set(P.map(p=>p.name))].sort(),cs=[...new Set(lifts().map(x=>x.b.contractor).filter(Boolean))].sort(),sel=(id,l,a)=>{const c=$(id).value;$(id).innerHTML=`<option value="">${l}</option>`+a.map(x=>`<option${x===c?' selected':''}>${E(x)}</option>`).join('')};
 sel('fp_','All projects',ps);sel('fc','All contractors',cs);$('pl').innerHTML=ps.map(x=>`<option value="${E(x)}">`).join('');
 $('fb').hidden=!(view==='dash'||view==='trk');$('q').hidden=view!=='trk';$('ex').hidden=!canEdit();
 $('me').innerHTML=`<b>${E(ME.name)}</b> · ${{super:'Super Admin',editor:'Editor',management:'Management'}[ROLE]}<br><a id="cp">Change password</a><a id="so">Sign out</a>`;
 $('v').innerHTML=({dash,trk,prj,stg,usr})[view]();if($('pjd').open)$('pjb').innerHTML=pjHtml(PJ);$('cp').onclick=chpw;$('so').onclick=()=>auth.signOut()}
function openStep(p,bi,li,k){const pr=P.find(x=>x.id===p),b=pr.blds[bi],l=b.lifts[li],s=ST(l,k);SD={p,bi,li,k};$('sdt').textContent=STEPS.find(x=>x[0]===k)[2];$('sdi').textContent=`${pr.name} › ${b.name} › ${l.n}`;$('sdone').checked=done(l,k);$('sdd').value=s.d||'';$('sdtg').value=s.t||'';$('sdr').value=s.r||'';$('sda').checked=BLD.includes(k);$('sde').checked=false;$('tgw').hidden=!isS();
 $('nocw').hidden=k!=='noc';$('sdf').value='';$('sdrm').checked=false;$('rmw').hidden=!s.f;$('sdfc').textContent=s.f?'Attached: '+s.f.name:'No file attached yet.';$('sds').disabled=false;$('sd').showModal()}
$('sdto').onclick=()=>{$('sdd').value=T;$('sdone').checked=true};
$('sf').onsubmit=async e=>{e.preventDefault();const{p,bi,li,k}=SD,np=clone(p),nb=np.blds[bi],dn=$('sdone').checked,d=dn?$('sdd').value:'',tg=$('sdtg').value,r=$('sdr').value.trim(),ix=STEPS.findIndex(s=>s[0]===k),fl=$('sdf').files[0];
 if(fl&&fl.size>4e6)return alert('This file is larger than 4 MB. Please compress it or upload a smaller scan.');$('sds').disabled=true;let f;
 try{if(fl){toast('Uploading NOC…');f=await upNoc(fl,np.id)}}catch(x){$('sds').disabled=false;return alert('Upload failed: '+x.message)}
 ($('sda').checked?nb.lifts:[nb.lifts[li]]).forEach(l=>{const o={...(l.s&&l.s[k]),x:dn,d,r};if(isS())o.t=tg;if(l===nb.lifts[li]){if((f||$('sdrm').checked)&&o.f){delNoc(o.f);delete o.f}if(f)o.f=f}l.s={...(l.s||{}),[k]:o};
  if(dn&&$('sde').checked)STEPS.slice(0,ix).forEach(s=>{const q={...(l.s[s[0]]||{})};if(!(q.x||q.d)){q.x=true;l.s[s[0]]=q}})});
 await save(np);$('sd').close()};
$('sdc').onclick=()=>$('sd').close();
function rw(){$('wl').innerHTML=WR.map((r,i)=>`<div class="wr"><input data-w="${i}" data-f="b" placeholder="e.g. A Wing" value="${E(r.b)}"><input data-w="${i}" data-f="c" placeholder="Contractor" value="${E(r.c)}"><input data-w="${i}" data-f="f" placeholder="B2 + B1 + G + 1st to 35th + T" value="${E(r.f)}"><input data-w="${i}" data-f="n" type="number" min="1" value="${r.n}"><button type="button" class="b s d" data-wx="${i}">✕</button></div>`).join('')}
$('wl').oninput=e=>{const t=e.target;if(t.dataset.w!=null)WR[t.dataset.w][t.dataset.f]=t.dataset.f==='n'?+t.value:t.value};$('wl').onclick=e=>{const x=e.target.dataset.wx;if(x!=null&&WR.length>1){WR.splice(+x,1);rw()}};
$('wa').onclick=()=>{const l=WR[WR.length-1]||{};WR.push({b:'',c:l.c||'',f:l.f||'',n:l.n||2});rw()};$('wc').onclick=()=>$('wz').close();
function wiz(name){WR=[{b:'',c:'',f:'',n:2}];$('wp').value=name||'';rw();$('wz').showModal()}
$('wf').onsubmit=async e=>{const name=$('wp').value.trim();if(!name||!WR.some(r=>r.b.trim())){e.preventDefault();alert('Enter the project name and at least one building.');return}
 const id=slug(name),np=P.find(x=>x.id===id)?clone(id):{id,name,blds:[]};WR.filter(r=>r.b.trim()).forEach(r=>np.blds.push({name:r.b.trim(),contractor:r.c.trim(),floors:r.f.trim(),lifts:mkLifts(Math.max(1,r.n))}));await save(np)};
$('v').onclick=async e=>{const t=e.target,c=t.closest('.sc[data-k]');if(c){if(canEdit())openStep(c.dataset.p,+c.dataset.b,+c.dataset.l,c.dataset.k);return}
 const dl=t.closest('[data-dl]');if(dl){const[p,b,l]=dl.dataset.dl.split('|');return dlNoc(ST(P.find(x=>x.id===p).blds[+b].lifts[+l],'noc').f)}
 const pj=t.closest('[data-pj]');if(pj)return openPj(pj.dataset.pj);
 const ln=t.closest('.lnm');if(ln&&isS()){const np=clone(ln.dataset.p),l=np.blds[+ln.dataset.b].lifts[+ln.dataset.l],n=prompt('Lift name:',l.n);if(!n)return;l.n=n.trim();const sp=prompt('Lift specification (e.g. Passenger 13P · 2.5 m/s · B2 to T):',l.spec||'');l.spec=(sp||'').trim();return save(np)}
 const a=t.closest('[data-a]');if(!a||!isS())return;const k=a.dataset.a,p=a.dataset.p,bi=+a.dataset.b;
 if(k[0]==='s'&&k.length===2)return stgAct(k,+a.dataset.i);if(k==='np')return wiz();if(k==='ab')return wiz(P.find(x=>x.id===p).name);if(k==='nu'){$('uf').reset();return $('ud').showModal()}
 if(k==='rp'){const n=prompt('New project name:',P.find(x=>x.id===p).name);if(!n||!n.trim())return;const nid=slug(n),np=clone(p);if(nid!==p&&P.some(x=>x.id===nid))return alert('A project with that name already exists.');np.id=nid;np.name=n.trim();await save(np);if(nid!==p)await col.doc(p).delete();return}
 if(k==='dp'){if(confirm('Delete this whole project with all its buildings and lifts? This cannot be undone.'))await col.doc(p).delete();return}
 if(k==='rs'){try{await auth.sendPasswordResetEmail(a.dataset.e);toast('Reset link emailed ✓')}catch(x){alert(x.message)}return}
 if(k==='du'){if(confirm('Remove this user\'s access? (Their login account stays but they can no longer open the tracker.)'))await fdb.doc('users/'+a.dataset.e).delete();return}
 const np=clone(p),b=np.blds[bi];
 if(k==='pl')b.lifts.push({n:'L'+(b.lifts.length+1),s:{}});
 else if(k==='ml'){if(b.lifts.length<2)return;const l=b.lifts[b.lifts.length-1];if(STEPS.some(s=>l.s&&l.s[s[0]]&&l.s[s[0]].d)&&!confirm('The last lift already has completed steps. Remove it anyway?'))return;b.lifts.pop()}
 else if(k==='eb'){const n=prompt('Building / sub-project name:',b.name);if(!n)return;b.name=n.trim();const c=prompt('Contractor name:',b.contractor||'');b.contractor=(c||'').trim();const fl=prompt('Floors (e.g. B2 + B1 + G + 1st to 35th + T):',b.floors||'');b.floors=(fl||'').trim()}
 else if(k==='db'){if(!confirm('Delete this building and its lifts?'))return;np.blds.splice(bi,1)}
 if(np.blds.length)await save(np);else await col.doc(p).delete()};
$('v').onchange=async e=>{const t=e.target;if(!isS())return;if(t.dataset.ur)await fdb.doc('users/'+t.dataset.ur).update({role:t.value});if(t.dataset.ua)await fdb.doc('users/'+t.dataset.ua).update({active:t.checked});toast('Saved ✓')};
$('v').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.id){d.open?OPEN.add(d.dataset.id):OPEN.delete(d.dataset.id)}},true);
$('v').addEventListener('input',e=>{const t=e.target;if(t.dataset.si!=null&&SGD){const x=SGD[+t.dataset.si];t.dataset.f==='n'?x.n=t.value:x[t.dataset.f]=t.checked}});
$('uc_').onclick=()=>$('ud').close();
$('uf').onsubmit=async e=>{e.preventDefault();const em=$('ue').value.trim().toLowerCase(),btn=e.submitter;btn&&(btn.disabled=true);
 try{const a2=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FB,'sec');try{await a2.auth().createUserWithEmailAndPassword(em,$('up').value)}catch(x){if(x.code!=='auth/email-already-in-use')throw x}await a2.auth().signOut();
  await fdb.doc('users/'+em).set({name:$('un').value.trim(),email:em,role:$('ur').value,active:true,created:T});$('ud').close();toast('User created ✓');alert('Share these login details with '+$('un').value.trim()+':\n\nLogin ID: '+em+'\nPassword: '+$('up').value)}catch(x){alert(/permission/i.test(x.message||x.code)?'Could not save the user because the database security rules have not been updated yet. Please publish the latest rules (Firebase → Firestore → Rules) and try again.':'Could not create user: '+(x.message||x.code))}btn&&(btn.disabled=false)};
['fp_','fc'].forEach(i=>$(i).onchange=render);$('q').oninput=render;$('pr').onclick=()=>window.print();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
$('ex').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',hd=['Project','Sub-project','Contractor','Lift'].concat(...STEPS.map(s=>[s[2]+' (done)',s[2]+' (target)'])),
 rows=lifts().filter(flt).map(x=>[x.p.name,x.b.name,x.b.contractor||'',x.l.n].concat(...STEPS.map(s=>[ST(x.l,s[0]).d||'',ST(x.l,s[0]).t||''])));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([[hd,...rows].map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='Lift_NOC_Tracker_'+T+'.csv';a.click()};
async function chpw(){const p=prompt('New password (at least 6 characters):');if(!p)return;try{await auth.currentUser.updatePassword(p);toast('Password changed ✓')}catch(x){alert(x.code==='auth/requires-recent-login'?'Please sign out, sign in again, and then change your password.':x.message)}}
const msg=c=>({'auth/invalid-credential':'Wrong ID or password.','auth/wrong-password':'Wrong ID or password.','auth/user-not-found':'Wrong ID or password.','auth/invalid-email':'Enter your full email address.','auth/too-many-requests':'Too many attempts. Try again later.','auth/network-request-failed':'No internet connection.'}[c]||'Could not sign in ('+c+').');
async function who(u){const em=(u.email||'').toLowerCase();try{const a=(await fdb.doc('config/access').get()).data()||{};if((a.editors||[]).map(x=>x.toLowerCase()).includes(em))return{role:'super',name:em}}catch(e){}
 try{const d=await fdb.doc('users/'+em).get();if(d.exists){const x=d.data();if(x.active!==false&&['editor','management'].includes(x.role))return{role:x.role,name:x.name||em}}}catch(e){}return null}
if(!FB.apiKey||/^PASTE/.test(FB.apiKey)){$('le').textContent='Firebase is not set up in this file yet.';$('lf').onsubmit=e=>e.preventDefault()}
else{firebase.initializeApp(FB);auth=firebase.auth();fdb=firebase.firestore();
 auth.onAuthStateChanged(async u=>{unsub.forEach(f=>f());unsub=[];P=[];CM=[];UL=[];ROLE='';applyStages(DEF);SGD=null;
  if(!u){document.body.classList.add('lock');$('lgn').hidden=false;return}
  const r=await who(u);if(!r){$('le').textContent='This login has no access to the tracker. Please contact the administrator.';await auth.signOut();return}
  ROLE=r.role;ME={name:r.name};$('le').textContent='';$('lp').value='';document.body.classList.remove('lock');$('lgn').hidden=true;view='dash';
  col=fdb.collection('projects');unsub.push(fdb.doc('config/stages').onSnapshot(d=>{if(d.exists&&d.data().list&&!SGD)applyStages(d.data().list);render()},()=>{}));unsub.push(fdb.collection('comments').onSnapshot(s=>{CM=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.at||'').localeCompare(a.at||''));render()},()=>{}));unsub.push(col.onSnapshot(s=>{P=s.docs.map(d=>({...d.data(),id:d.id}));render()},e=>alert('Could not load data: '+e.message)));
  if(isS())unsub.push(fdb.collection('users').onSnapshot(s=>{UL=s.docs.map(d=>d.data()).sort((a,b)=>(a.name||'').localeCompare(b.name||''));if(view==='usr')render()},()=>{}));render()});
 $('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';try{await auth.signInWithEmailAndPassword($('li').value.trim().toLowerCase(),$('lp').value)}catch(x){$('le').textContent=msg(x.code)}};
 $('fp').onclick=async e=>{e.preventDefault();const id=$('li').value.trim().toLowerCase();if(!id.includes('@')){$('le').textContent='Type your email in the Login ID box first, then click Forgot password.';return}try{await auth.sendPasswordResetEmail(id);$('le').textContent='A reset link was sent to '+id+'. Check your inbox (and spam).'}catch(x){$('le').textContent=msg(x.code)}}}
</script></body></html>
